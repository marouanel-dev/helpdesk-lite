# Pipeline DevSecOps de HelpDesk Lite
#
# Chaque push sur main déclenche 8 contrôles de sécurité.
# L'image Docker n'est publiée sur Docker Hub que si TOUS les contrôles passent.
#
#   1 Secrets    -> Gitleaks       : mots de passe / clés écrits dans le code
#   2 SAST       -> Semgrep        : failles dans le code source (injection SQL, XSS...)
#   3 Tests      -> pytest         : tests fonctionnels + tests de sécurité
#   4 SCA        -> Trivy fs       : bibliothèques Python avec des CVE connues
#   5 IaC        -> Trivy config   : mauvaises pratiques dans le Dockerfile
#   6 Build      -> docker build   : construction de l'image (une seule fois)
#   7 Image      -> Trivy image    : CVE dans l'image (système + paquets)
#   8 DAST       -> OWASP ZAP      : test de l'application en cours d'exécution
#   9 Publication-> Docker Hub     : uniquement si 1 à 8 sont au vert

name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: helpdesk-lite
  PYTHON_VERSION: "3.13"
  GITLEAKS_VERSION: "8.30.1"
  SEMGREP_VERSION: "1.184.0"
  TRIVY_VERSION: "0.76.2"

jobs:
  secrets:
    name: 1 · Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Gitleaks
        run: |
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo mv "$RUNNER_TEMP/gitleaks" /usr/local/bin/

      - name: Rechercher des secrets dans le code
        run: gitleaks dir . --redact --verbose --no-banner

  sast:
    name: 2 · SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer Semgrep
        run: pip install "semgrep==${SEMGREP_VERSION}"

      - name: Analyse statique du code
        run: semgrep scan --config p/python --config p/flask --error --metrics=off

  tests:
    name: 3 · Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: pytest

  sca:
    name: 4 · Dépendances (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Trivy
        run: |
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          sudo mv "$RUNNER_TEMP/trivy" /usr/local/bin/

      - name: Rechercher les CVE dans requirements.txt
        run: trivy fs . --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

  iac:
    name: 5 · Dockerfile (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Trivy
        run: |
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          sudo mv "$RUNNER_TEMP/trivy" /usr/local/bin/

      - name: Analyser la configuration du Dockerfile
        run: trivy config . --severity HIGH,CRITICAL --exit-code 1

  build:
    name: 6 · Build de l'image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Construire l'image Docker
        run: docker build -t "${IMAGE_NAME}:ci" .

      - name: Exporter l'image
        run: docker save "${IMAGE_NAME}:ci" -o image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: image-docker
          path: image.tar
          retention-days: 1

  image-scan:
    name: 7 · Scan de l'image (Trivy)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-docker

      - name: Installer Trivy
        run: |
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          sudo mv "$RUNNER_TEMP/trivy" /usr/local/bin/

      - name: Rechercher les CVE dans l'image
        run: trivy image --input image.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

  dast:
    name: 8 · DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: image-docker

      - name: Démarrer l'application
        run: |
          docker load -i image.tar
          docker run -d --name helpdesk -p 8000:8000 \
            -e SECRET_KEY="$(openssl rand -hex 32)" \
            "${IMAGE_NAME}:ci"
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8000/login; then
              echo "Application prête"; exit 0
            fi
            sleep 2
          done
          echo "L'application n'a pas démarré"; docker logs helpdesk; exit 1

      - name: Scan OWASP ZAP (baseline)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:8000
          rules_file_name: .zap/rules.tsv
          cmd_options: -I
          fail_action: true
          allow_issue_writing: false
          artifact_name: rapport-zap

      - name: Journaux de l'application
        if: always()
        run: docker logs helpdesk

  publish:
    name: 9 · Publication (Docker Hub)
    runs-on: ubuntu-latest
    needs: [secrets, sast, tests, sca, iac, image-scan, dast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-docker

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publier l'image validée
        env:
          REPO: ${{ vars.DOCKERHUB_USERNAME }}/helpdesk-lite
        run: |
          docker load -i image.tar
          docker tag "${IMAGE_NAME}:ci" "${REPO}:latest"
          docker tag "${IMAGE_NAME}:ci" "${REPO}:${GITHUB_SHA::7}"
          docker push "${REPO}:latest"
          docker push "${REPO}:${GITHUB_SHA::7}"
          echo "### Image publiée : \`${REPO}:${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
